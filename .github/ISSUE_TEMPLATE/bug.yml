name: Bug report
description: Report a reproducible ShareGuard problem using fictional data only.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ShareGuard. Do not include real passwords, tokens, payment details, or private screenshots.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 153
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fictional data only.
      placeholder: |
        1. Open ...
        2. Start protection ...
        3. Navigate to ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Could this expose sensitive information to the audience?
      options:
        - "No"
        - "Possibly"
        - "Yes - I will report privately instead"
    validations:
      required: true
  - type: checkboxes
    id: safe-data
    attributes:
      label: Test data
      options:
        - label: I used only fictional or synthetic data in this report.
          required: true
